# Deploys the design mockup to the Cloudflare Worker "jormungand-design" on every push
# that touches it. Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy mockup

on:
  push:
    paths: ['design/**', 'wrangler.jsonc', 'package.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency: { group: deploy-mockup, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node design/tools/build.mjs --check   # committed html must match src
      - run: node design/tools/stage.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
