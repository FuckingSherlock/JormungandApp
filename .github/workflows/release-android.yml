# Builds the Android app (release APKs per ABI, signed with the release key) and publishes it to
# the update feed (docs/updates.md section 13), two channels from this one workflow:
#   beta   - every push to the default branch (touching app/, core/ or this file) and a manual run;
#            version <base>-beta.<n> (n counts per base from the feed), a prerelease `v<version>` + manifest-beta.json(.sig).
#   stable - a pushed tag `vX.Y.Z` (or a manual run with channel=stable on a tag / the default
#            branch); version X.Y.Z, a normal release `vX.Y.Z` + manifest-stable.json(.sig).
# Installers -> a release of FuckingSherlock/jormungand-releases, then the signed manifest -> the
# fixed release `feed`.
#
# Repo secrets: JORM_ANDROID_KEYSTORE_B64 (base64 of the release .jks), JORM_ANDROID_KS_PASS (its
# store + key password), JORM_RELEASE_KEY (Ed25519 manifest-signing key file), JORM_RELEASES_TOKEN
# (fine-grained PAT, contents:write on jormungand-releases); optional JORM_NOTIFY_TOKEN (the Telegram
# announcement, workers/reports POST /v1/release; unset = no announcement). No artifacts are uploaded: the
# keystore and the key live in $RUNNER_TEMP only and are deleted at the end.
name: Release Android

on:
  push:
    branches: [claude/karing-fork-environment-a45c2c]
    paths: ['app/**', 'core/**', '.github/workflows/release-android.yml', '.github/scripts/beta_notes.sh', 'release-notes/beta.txt']
    # path filters are not evaluated for tag pushes: a tag always builds the tagged commit
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel (stable: run it on a vX.Y.Z tag or the default branch)'
        type: choice
        options: [beta, stable]
        default: beta

# a newer branch push cancels the older beta run of the same ref; a stable run (a tag, or a manual
# run with channel=stable) has its own group and is never cancelled
concurrency:
  group: release-android-${{ github.ref }}-${{ inputs.channel || 'push' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.channel != 'stable' }}

permissions:
  contents: read

env:
  SING_BOX_VERSION: '1.14.2'      # keep equal to core/tool/bin/sing-box (the desktop core)
  NDK_VERSION: '28.2.13676358'    # as in core/tool/build_libbox.ps1
  FEED_REPO: FuckingSherlock/jormungand-releases
  # versionCode = BUILD_OFFSET + run number, for BOTH channels: one workflow, so one run counter
  # that only grows. Above every versionCode a local build has used (the old per-ABI offsets
  # reached 2000 + n), and it must never go down (docs/updates.md section 5)
  BUILD_OFFSET: '3000'
  KEEP_BETAS: '10'
  # delta updates (docs/updates.md, "Дельта-обновления"): patches from the APKs of this many latest
  # releases of the same channel (must stay <= KEEP_BETAS: the cleanup below keeps that many), and a
  # patch bigger than this share of the whole APK is not worth publishing
  DELTA_FROM: '3'
  DELTA_MAX_PERCENT: '60'

jobs:
  # Until the one-time secrets are set (docs/updates.md section 13) a push only notes it and
  # stops, instead of failing every commit.
  secrets-ready:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          A: ${{ secrets.JORM_ANDROID_KEYSTORE_B64 }}
          B: ${{ secrets.JORM_ANDROID_KS_PASS }}
          C: ${{ secrets.JORM_RELEASE_KEY }}
          D: ${{ secrets.JORM_RELEASES_TOKEN }}
        run: |
          if [ -n "$A" ] && [ -n "$B" ] && [ -n "$C" ] && [ -n "$D" ]; then echo ok=true >> "$GITHUB_OUTPUT"
          else echo "::notice::Release secrets not set yet - skipping the release"; echo ok=false >> "$GITHUB_OUTPUT"; fi

  release:
    needs: secrets-ready
    if: needs.secrets-ready.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        # the full history: the beta notes collect the commits since the previous beta
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.6', channel: stable, cache: true }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: false }

      - name: Android SDK components
        run: |
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.1.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: libbox.aar cache
        id: libbox
        uses: actions/cache/restore@v4
        with:
          path: app/android_overlay/app/libs
          key: libbox-${{ env.SING_BOX_VERSION }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('core/tool/build_libbox.ps1') }}

      - name: Build libbox.aar (cache miss)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: pwsh core/tool/build_libbox.ps1 -Version "$SING_BOX_VERSION" -Root "$RUNNER_TEMP/android-dev"

      # saved right away, so a later failing step doesn't throw the ~10 min build away
      - name: Save libbox.aar cache
        if: steps.libbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/android_overlay/app/libs
          key: ${{ steps.libbox.outputs.cache-primary-key }}

      # Channel, version, build. Rules (docs/updates.md section 5 and 13):
      #  - channel: a tag push is stable, a manual run takes the input, a branch push is beta;
      #  - stable: X.Y.Z of the tag, which must equal the pubspec X.Y.Z (a forgotten bump fails
      #    here, not after the release); a manual run on the default branch takes the pubspec one;
      #    it must be above the stable already in the feed (equal only on a re-run of the same run);
      #  - beta: <base>-beta.<run>, base = the larger of the pubspec X.Y.Z and the newest published
      #    stable with the patch + 1, so a beta always orders above the last stable (0.1.0 stable ->
      #    betas are 0.1.1-beta.N, otherwise beta users would sit below the release forever);
      #  - build (versionCode) = BUILD_OFFSET + run number, the same counter for both channels.
      - name: Channel and version
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          pub=$(sed -n 's/^version: *\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' app/pubspec.yaml | head -n 1)
          [ -n "$pub" ] || { echo "::error::no X.Y.Z version in app/pubspec.yaml"; exit 1; }

          if [ "$GITHUB_REF_TYPE" = tag ]; then channel=stable
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then channel="${INPUT_CHANNEL:-beta}"
          else channel=beta; fi

          # newest published stable: empty when none (404); any other answer is an error, not "none"
          stable=""
          url="https://github.com/$FEED_REPO/releases/download/feed/manifest-stable.json"
          code=$(curl -sSL -o "$RUNNER_TEMP/manifest-stable.json" -w '%{http_code}' "$url") || { echo "::error::cannot reach the feed"; exit 1; }
          if [ "$code" = 200 ]; then
            stable=$(jq -er '.version' "$RUNNER_TEMP/manifest-stable.json") || { echo "::error::bad manifest-stable.json in the feed"; exit 1; }
            [[ "$stable" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::feed stable version '$stable' is not X.Y.Z"; exit 1; }
          elif [ "$code" != 404 ]; then
            echo "::error::feed answered HTTP $code for manifest-stable.json"; exit 1
          fi
          newest() { printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1; }

          if [ "$channel" = stable ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              version="${GITHUB_REF_NAME#v}"
              [ "$version" = "$pub" ] || { echo "::error::tag $GITHUB_REF_NAME does not match app/pubspec.yaml version $pub - bump it, commit, move the tag"; exit 1; }
            elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
              version="$pub"
            else
              echo "::error::stable is built from a vX.Y.Z tag or the default branch, not from $GITHUB_REF"; exit 1
            fi
            if [ -n "$stable" ]; then
              top=$(newest "$stable" "$version")
              if [ "$top" != "$version" ] || { [ "$stable" = "$version" ] && [ "$RUN_ATTEMPT" = 1 ]; }; then
                echo "::error::stable $version is not above the published stable $stable"; exit 1
              fi
            fi
          else
            base="$pub"
            if [ -n "$stable" ]; then
              IFS=. read -r a b c <<< "$stable"
              base=$(newest "$pub" "$a.$b.$((c + 1))")
            fi
            # beta number counts per base: the newest beta in the feed of the same base + 1, else 1;
            # a re-run of the run that published it (same build) keeps its number
            n=1
            code=$(curl -sSL -o "$RUNNER_TEMP/manifest-beta.json" -w '%{http_code}' \
              "https://github.com/$FEED_REPO/releases/download/feed/manifest-beta.json") || { echo "::error::cannot reach the feed"; exit 1; }
            if [ "$code" = 200 ]; then
              prev=$(jq -er '.version' "$RUNNER_TEMP/manifest-beta.json") || { echo "::error::bad manifest-beta.json in the feed"; exit 1; }
              prevBuild=$(jq -er '.build' "$RUNNER_TEMP/manifest-beta.json") || { echo "::error::bad manifest-beta.json in the feed"; exit 1; }
              if [[ "$prev" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta\.([0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" = "$base" ]; then
                if [ "$prevBuild" = "$((BUILD_OFFSET + GITHUB_RUN_NUMBER))" ]; then n="${BASH_REMATCH[2]}"
                else n=$((BASH_REMATCH[2] + 1)); fi
              fi
            elif [ "$code" != 404 ]; then
              echo "::error::feed answered HTTP $code for manifest-beta.json"; exit 1
            fi
            version="$base-beta.$n"
          fi

          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD=$((BUILD_OFFSET + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Channel $channel, version $version, build $((BUILD_OFFSET + GITHUB_RUN_NUMBER)) (pubspec $pub, published stable ${stable:-none})"

      # Russian is translated only for stable (docs/i18n.md): a stable with strings still without Russian fails here
      - name: Russian complete (stable)
        if: env.CHANNEL == 'stable'
        run: node app/tool/gen_i18n.mjs --missing

      # Release notes (docs/updates.md section 13, "Заметки к релизу"), before the build so a missing
      # one fails in a minute. dist/notes.txt (en) and dist/notes.ru.txt: stable - release-notes/X.Y.Z.ru.txt (+ optional .en.txt)
      # (written in the Russian translation pass); beta - a header line (its commit is where the next
      # beta's notes start) + the Russian summary release-notes/beta.txt as committed since the previous
      # beta (.github/scripts/beta_notes.sh), the same text in both
      - name: Release notes
        run: |
          dist="$RUNNER_TEMP/dist"; mkdir -p "$dist"
          if [ "$CHANNEL" = stable ]; then
            f="release-notes/$VERSION.ru.txt"
            [ -n "$(tr -d '[:space:]' < "$f" 2> /dev/null)" ] || { echo "::error::$f is missing or empty - write the stable release notes (release-notes/README.md)"; exit 1; }
            cp "$f" "$dist/notes.ru.txt"
            # English is optional for now (the testers are Russian): without it the Russian text is the default
            en="release-notes/$VERSION.en.txt"
            if [ -n "$(tr -d '[:space:]' < "$en" 2> /dev/null)" ]; then cp "$en" "$dist/notes.txt"; else cp "$f" "$dist/notes.txt"; fi
          else
            if ! body=$(bash .github/scripts/beta_notes.sh "$RUNNER_TEMP/manifest-beta.json"); then
              echo "::error::release-notes/beta.txt was not updated since the previous beta - write the summary of this beta (release-notes/README.md) and push it"; exit 1
            fi
            printf 'Beta %s (build %s, commit %s)\n\n%s\n' "$VERSION" "$BUILD" "${GITHUB_SHA:0:7}" "$body" > "$dist/notes.txt"
            printf 'Бета %s (сборка %s, коммит %s)\n\n%s\n' "$VERSION" "$BUILD" "${GITHUB_SHA:0:7}" "$body" > "$dist/notes.ru.txt"
          fi
          { echo "Notes:"; sed 's/^/  /' "$dist/notes.ru.txt"; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Release keystore
        env:
          KS_B64: ${{ secrets.JORM_ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KS_B64" ] || { echo "::error::secret JORM_ANDROID_KEYSTORE_B64 is not set"; exit 1; }
          ( umask 077; printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/jorm-release.jks" )
          echo "JORM_KEYSTORE=$RUNNER_TEMP/jorm-release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          JORM_ANDROID_KS_PASS: ${{ secrets.JORM_ANDROID_KS_PASS }}
        run: pwsh app/tool/build_apk.ps1 -BuildName "$VERSION" -BuildNumber "$BUILD" -KeystorePath "$JORM_KEYSTORE"

      - name: Check the APKs and stage the files
        env:
          JORM_ANDROID_KS_PASS: ${{ secrets.JORM_ANDROID_KS_PASS }}
        run: |
          # SHA-256 of the signing certificate: lower-case hex, no colons (manifest android.signerSha256)
          signer=$(keytool -list -v -keystore "$JORM_KEYSTORE" -alias jormungand -storepass:env JORM_ANDROID_KS_PASS \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ': \r' | tr 'A-F' 'a-f')
          [ "${#signer}" -eq 64 ] || { echo "::error::cannot read the keystore certificate"; exit 1; }
          echo "SIGNER=$signer" >> "$GITHUB_ENV"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          mkdir -p "$RUNNER_TEMP/dist"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            dst="$RUNNER_TEMP/dist/jormungand-$VERSION-$abi.apk"
            cp "$src" "$dst"
            # signed with the release key (not the debug fallback) and versionCode == build
            got=$("$bt/apksigner" verify --print-certs "$dst" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -n 1)
            [ "$got" = "$signer" ] || { echo "::error::$abi APK is not signed with the release key"; exit 1; }
            code=$("$bt/aapt2" dump badging "$dst" | sed -n "s/.* versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
            [ "$code" = "$BUILD" ] || { echo "::error::$abi APK versionCode is '$code', expected $BUILD"; exit 1; }
          done
          ls -l "$RUNNER_TEMP/dist"

      # Delta patches (docs/updates.md, "Дельта-обновления"): for every ABI, a patch from the APK of
      # each of the last DELTA_FROM releases of the same channel that are still in the feed repo (beta:
      # prereleases vB; stable: stable releases; never `feed`, never this release) to the new APK.
      # Nothing here may fail the release: an old APK that cannot be fetched, a patch that cannot be
      # made / does not apply back, or one bigger than DELTA_MAX_PERCENT of the APK only skips that
      # delta (a warning). The kept ones are listed in deltas.txt (`<platform>=<patch>,<sha256 of the
      # old APK>`) for the manifest and the upload. Runs before the retention cleanup of the publish step.
      - name: Delta patches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.JORM_RELEASES_TOKEN }}
        run: |
          dist="$RUNNER_TEMP/dist"; work="$RUNNER_TEMP/delta-work"
          mkdir -p "$work"; : > "$dist/deltas.txt"
          if [ "$CHANNEL" = beta ]; then pre=true; pat='^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'
          else pre=false; pat='^v[0-9]+\.[0-9]+\.[0-9]+$'; fi
          tags=$(gh release list --repo "$FEED_REPO" --limit 100 --json tagName,publishedAt,isPrerelease \
            | jq -r --argjson pre "$pre" --arg pat "$pat" --arg cur "v$VERSION" --argjson n "$DELTA_FROM" \
              '[.[] | select(.isPrerelease == $pre and (.tagName | test($pat)) and .tagName != $cur)]
               | sort_by(.publishedAt) | reverse | .[:$n] | .[].tagName') || tags=""
          if [ -z "$tags" ]; then echo "No earlier $CHANNEL release to make a delta from"; exit 0; fi
          ( cd core && dart pub get ) || { echo "::warning::dart pub get failed, no deltas"; exit 0; }
          for tag in $tags; do
            oldver="${tag#v}"
            for abi in arm64-v8a armeabi-v7a x86_64; do
              new="$dist/jormungand-$VERSION-$abi.apk"
              old="$work/$tag/jormungand-$oldver-$abi.apk"
              patch="$dist/jormungand-$VERSION-$abi-from-$oldver.delta"
              mkdir -p "$work/$tag"
              if ! gh release download "$tag" --repo "$FEED_REPO" --pattern "jormungand-$oldver-$abi.apk" --dir "$work/$tag"; then
                echo "::warning::cannot fetch the $abi APK of $tag, no delta from it"; continue
              fi
              if ! out=$(cd core && dart run tool/make_delta.dart "$old" "$new" "$patch"); then
                echo "::warning::cannot make the $abi delta from $tag"; rm -f "$patch" "$old"; continue
              fi
              rm -f "$old"
              from=$(printf '%s\n' "$out" | sed -n 's/^from=//p'); psize=$(stat -c %s "$patch"); full=$(stat -c %s "$new")
              if ! [[ "$from" =~ ^[0-9a-f]{64}$ ]]; then echo "::warning::no sha256 from make_delta for $abi/$tag"; rm -f "$patch"; continue; fi
              if [ $((psize * 100)) -gt $((full * DELTA_MAX_PERCENT)) ]; then
                echo "::warning::$abi delta from $tag is $psize of $full bytes (over $DELTA_MAX_PERCENT %), not published"; rm -f "$patch"; continue
              fi
              echo "android-$abi=$patch,$from" >> "$dist/deltas.txt"
              echo "$abi delta from $tag: $psize bytes (APK $full)"
            done
          done
          { echo "Deltas:"; sed 's/^/  /' "$dist/deltas.txt"; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Signed manifest
        env:
          JORM_RELEASE_KEY: ${{ secrets.JORM_RELEASE_KEY }}
        run: |
          [ -n "$JORM_RELEASE_KEY" ] || { echo "::error::secret JORM_RELEASE_KEY is not set"; exit 1; }
          key="$RUNNER_TEMP/jorm-release-signing.key"   # outside the workspace: the tool refuses a key inside a git tree
          ( umask 077; printf '%s\n' "$JORM_RELEASE_KEY" > "$key" )
          dist="$RUNNER_TEMP/dist"
          # the deltas the previous step kept (`<platform>=<patch>,<sha256 of the old APK>` per line)
          delta_args=()
          if [ -s "$dist/deltas.txt" ]; then
            while IFS= read -r l; do
              if [ -n "$l" ]; then delta_args+=(--delta "$l"); fi
            done < "$dist/deltas.txt"
          fi
          cd core
          dart pub get
          dart run tool/release_manifest.dart --key "$key" --version "$VERSION" --build "$BUILD" --channel "$CHANNEL" --out "$dist" \
            --asset "android-arm64-v8a=$dist/jormungand-$VERSION-arm64-v8a.apk" \
            --asset "android-armeabi-v7a=$dist/jormungand-$VERSION-armeabi-v7a.apk" \
            --asset "android-x86_64=$dist/jormungand-$VERSION-x86_64.apk" \
            "${delta_args[@]}" \
            --url-base "https://github.com/$FEED_REPO/releases/download/v$VERSION" \
            --signer-sha256 "$SIGNER" \
            --page "https://github.com/$FEED_REPO/releases" \
            --notes-en "$dist/notes.txt" --notes-ru "$dist/notes.ru.txt"
          rm -f "$key"

      - name: Publish to the feed repo
        env:
          GH_TOKEN: ${{ secrets.JORM_RELEASES_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::secret JORM_RELEASES_TOKEN is not set"; exit 1; }
          cd "$RUNNER_TEMP/dist"
          tag="v$VERSION"
          # the installers, and the delta patches the manifest lists (only those: a half-made one is never uploaded)
          files=(jormungand-*.apk)
          if [ -s deltas.txt ]; then
            while IFS= read -r l; do
              if [ -n "$l" ]; then l="${l#*=}"; files+=("${l%,*}"); fi
            done < deltas.txt
          fi
          # 1. the installers (a re-run of the same run overwrites them); beta = prerelease, stable = a normal release
          if gh release view "$tag" --repo "$FEED_REPO" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$FEED_REPO" --clobber
          else
            kind=$([ "$CHANNEL" = beta ] && echo --prerelease || echo --latest)
            gh release create "$tag" "${files[@]}" --repo "$FEED_REPO" $kind \
              --title "Jormungand $VERSION" --notes-file notes.ru.txt
          fi
          # 2. the feed release (fixed tag) and, only after the APKs are up, the signed manifest
          if ! gh release view feed --repo "$FEED_REPO" > /dev/null 2>&1; then
            gh release create feed --repo "$FEED_REPO" --prerelease --title "Update feed" \
              --notes "Update manifests (manifest-<channel>.json + .sig), overwritten on every release. Do not delete."
          fi
          gh release upload feed "manifest-$CHANNEL.json" "manifest-$CHANNEL.json.sig" --repo "$FEED_REPO" --clobber
          # 3. beta only: keep the newest KEEP_BETAS beta releases; never `feed`, never a stable release
          #    (stable releases are never pruned)
          if [ "$CHANNEL" = beta ]; then
            gh release list --repo "$FEED_REPO" --limit 200 --json tagName,publishedAt,isPrerelease \
              | jq -r --argjson keep "$KEEP_BETAS" --arg cur "$tag" \
                '[.[] | select(.isPrerelease and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+$")) and .tagName != $cur)]
                 | sort_by(.publishedAt) | reverse | .[($keep - 1):] | .[].tagName' \
              | while read -r old; do
                  echo "deleting old beta $old"
                  gh release delete "$old" --repo "$FEED_REPO" --yes --cleanup-tag
                done
          fi
          echo "Published $VERSION (build $BUILD) to the $CHANNEL channel" >> "$GITHUB_STEP_SUMMARY"

      # Telegram announcement through the reports Worker (workers/reports/README.md, "Анонсы релизов"):
      # the Russian notes (beta: without their header line). Never fails the release;
      # the Worker skips a version+build it has already announced, so a re-run does not post twice
      - name: Announce in Telegram
        continue-on-error: true
        env:
          NOTIFY_TOKEN: ${{ secrets.JORM_NOTIFY_TOKEN }}
        run: |
          [ -n "$NOTIFY_TOKEN" ] || { echo "::notice::JORM_NOTIFY_TOKEN is not set - no Telegram announcement"; exit 0; }
          dist="$RUNNER_TEMP/dist"
          if [ "$CHANNEL" = stable ]; then notes=$(cat "$dist/notes.ru.txt"); else notes=$(tail -n +3 "$dist/notes.ru.txt"); fi
          jq -n --arg c "$CHANNEL" --arg v "$VERSION" --argjson b "$BUILD" --arg n "$notes" \
            --arg u "https://github.com/$FEED_REPO/releases/tag/v$VERSION" \
            '{channel: $c, version: $v, build: $b, notes: $n, url: $u}' > "$RUNNER_TEMP/announce.json"
          if ! out=$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 30 -X POST \
              -H "Authorization: Bearer $NOTIFY_TOKEN" -H 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/announce.json" https://jormungand-reports.slackerwarlock.workers.dev/v1/release); then
            echo "::warning::Telegram announcement failed: $out"; exit 1
          fi
          echo "Telegram: $out"

      - name: Remove the keystore and the key
        if: always()
        run: rm -f "$RUNNER_TEMP/jorm-release.jks" "$RUNNER_TEMP/jorm-release-signing.key" app/android/key.properties
